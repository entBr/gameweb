<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamePlanet</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="encabezado">
        <h1>GamePlanet</h1>
        <p>Programación y desarrollo de videojuegos</p>
    </header>

    <main class="contenedor">
        <section class="tarjeta">
            <h2>Registro de jugador</h2>
            <input id="nombreRegistro" type="text" placeholder="Nombre del jugador">
            <input id="correoRegistro" type="email" placeholder="Correo electrónico">
            <input id="passwordRegistro" type="password" placeholder="Contraseña">
            <button id="btnRegistro">Registrar jugador</button>
        </section>

        <section class="tarjeta">
            <h2>Inicio de sesión</h2>
            <input id="correoLogin" type="email" placeholder="Correo electrónico">
            <input id="passwordLogin" type="password" placeholder="Contraseña">
            <button id="btnLogin">Iniciar sesión</button>
        </section>

        <section class="tarjeta">
            <h2>Perfil del jugador</h2>
            <p><strong>Nombre:</strong> <span id="perfilNombre">Sin registrar</span></p>
            <p><strong>Avatar:</strong> <span id="perfilAvatar">Sin avatar</span></p>
            <p><strong>Nivel:</strong> <span id="perfilNivel">1</span></p>
            <p><strong>Monedas:</strong> <span id="perfilMonedas">0</span></p>
        </section>

        <section class="tarjeta">
            <h2>Tienda del videojuego</h2>
            <input id="cantidadMonedas" type="number" min="1" value="100">
            <button id="btnComprar">Comprar monedas</button>
        </section>

        <section class="tarjeta">
            <h2>Soporte para jugadores</h2>
            <textarea id="mensajeSoporte" placeholder="Describe tu problema"></textarea>
            <button id="btnEnviar" class="btn-enviar">Enviar</button>
        </section>

        <p id="estado" class="estado">Bienvenido a GamePlanet.</p>
    </main>

    <script src="app/config/loginConfig.js"></script>
    <script src="app/models/user.js"></script>
    <script src="app/services/registro.js"></script>
    <script src="app/services/login.js"></script>
    <script src="app/services/pagos.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
